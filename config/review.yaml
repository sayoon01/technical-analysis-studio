# Review loop — hard gates, not LLM vanity scores.

max_revisions: 3
manual_review_after_limit: true

# Phase 4: sequential only — Technical then Editorial. No ThreadPool.
sequential_reviewers:
  - technical
  - editorial

quality_gate:
  blockers:
    # Unfounded factual claims / fabricated metrics only — not analysis paragraphs.
    unsupported_major_claims: 0
    broken_citations: 0
    numeric_mismatches: 0
    unresolved_critical_issues: 0
    unrendered_visual_requests: 0
    # DraftValidator structural failures also block finalize
    draft_validator_ok: true
  limits:
    maximum_revision_count: 3
    duplicate_paragraph_ratio: 0.10
    # Soft signal: major factual claims should usually be cited; analysis may be uncited.
    uncited_major_claim_ratio: 0.05

# LLM numeric scores are advisory only.
advisory_scores:
  enabled: true
  never_override_blockers: true
