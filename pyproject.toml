[project]
name = "technical-analysis-studio"
version = "0.1.0"
description = "Expert technical analysis report generation (Ollama agents + deterministic skills)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "olefile>=0.46",
  "fpdf2>=2.7",
  "easyocr>=1.7",
  "rapidocr-onnxruntime>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
